name: TimeKeeper
options:
  bundleIdPrefix: app
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
  createIntermediateGroups: true
settings:
  base:
    PRODUCT_BUNDLE_IDENTIFIER: app.timekeeper
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.9"
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_KEY_CFBundleDisplayName: TimeKeeper
    INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.lifestyle
    SWIFT_STRICT_CONCURRENCY: minimal
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGNING_ALLOWED: NO
    CODE_SIGNING_REQUIRED: NO
targets:
  TimeKeeper-macOS:
    type: application
    platform: macOS
    sources:
      - path: TimeKeeperApp/Sources/TimeKeeperCore
        excludes:
          - "**/*.md"
          - "**/Resources/**"
      - path: TimeKeeperApp/Sources/TimeKeeperApp
        excludes:
          - "**/*.md"
      - path: TimeKeeperApp/Resources/SeedPhotos
        buildPhase: resources
      - path: TimeKeeperApp/Resources/AppIcon.png
        buildPhase: resources
        optional: true
    settings:
      base:
        PRODUCT_NAME: TimeKeeper
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGNING_ALLOWED: NO
  TimeKeeper-iOS:
    type: application
    platform: iOS
    sources:
      - path: TimeKeeperApp/Sources/TimeKeeperCore
        excludes:
          - "**/*.md"
          - "**/Resources/**"
      - path: TimeKeeperApp/Sources/TimeKeeperApp
        excludes:
          - "**/*.md"
      - path: TimeKeeperApp/Resources/SeedPhotos
        buildPhase: resources
      - path: TimeKeeperApp/Resources/AppIcon.png
        buildPhase: resources
        optional: true
    settings:
      base:
        PRODUCT_NAME: TimeKeeper
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGNING_ALLOWED: NO
schemes:
  TimeKeeper-macOS:
    build:
      targets:
        TimeKeeper-macOS: all
  TimeKeeper-iOS:
    build:
      targets:
        TimeKeeper-iOS: all
